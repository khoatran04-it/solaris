name: Solaris CD - Build & Deploy to Azure

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. BUILD & PUSH DOCKER IMAGES TO ACR
  # ==========================================
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # --------------------------------------------------
      # 1. BUILD & PUSH BACKEND
      # --------------------------------------------------
      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_NAME }}.azurecr.io/solaris-backend:${{ github.sha }}
            ${{ secrets.ACR_NAME }}.azurecr.io/solaris-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --------------------------------------------------
      # 2. BUILD & PUSH FRONTEND ADMIN
      # --------------------------------------------------
      - name: Build and push Frontend Admin image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-admin
          file: ./frontend-admin/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ secrets.PROD_API_URL || 'https://www.solaris-api.io.vn/api' }}
          tags: |
            ${{ secrets.ACR_NAME }}.azurecr.io/solaris-frontend-admin:${{ github.sha }}
            ${{ secrets.ACR_NAME }}.azurecr.io/solaris-frontend-admin:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --------------------------------------------------
      # 3. BUILD & PUSH FRONTEND SHOP
      # --------------------------------------------------
      - name: Build and push Frontend Shop image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-shop
          file: ./frontend-shop/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.PROD_SHOP_API_URL || 'https://www.solaris-api.io.vn/api/shop' }}
            NEXT_PUBLIC_SITE_URL=${{ secrets.PROD_SHOP_URL || 'https://www.solaris-os.io.vn' }}
          tags: |
            ${{ secrets.ACR_NAME }}.azurecr.io/solaris-frontend-shop:${{ github.sha }}
            ${{ secrets.ACR_NAME }}.azurecr.io/solaris-frontend-shop:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # 2. DEPLOY TO AZURE CONTAINER APPS
  # ==========================================
  deploy-azure:
    name: Deploy to Azure Container Apps
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Backend Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          imageToDeploy: ${{ secrets.ACR_NAME }}.azurecr.io/solaris-backend:${{ github.sha }}
          containerAppName: ${{ secrets.AZURE_BACKEND_APP_NAME || 'solaris-backend' }}
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP || 'rg-solaris-prod' }}
          acrName: ${{ secrets.ACR_NAME }}
          acrUsername: ${{ secrets.ACR_USERNAME }}
          acrPassword: ${{ secrets.ACR_PASSWORD }}

      - name: Deploy Admin Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          imageToDeploy: ${{ secrets.ACR_NAME }}.azurecr.io/solaris-frontend-admin:${{ github.sha }}
          containerAppName: ${{ secrets.AZURE_ADMIN_APP_NAME || 'solaris-admin' }}
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP || 'rg-solaris-prod' }}
          acrName: ${{ secrets.ACR_NAME }}
          acrUsername: ${{ secrets.ACR_USERNAME }}
          acrPassword: ${{ secrets.ACR_PASSWORD }}

      - name: Deploy Shop Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          imageToDeploy: ${{ secrets.ACR_NAME }}.azurecr.io/solaris-frontend-shop:${{ github.sha }}
          containerAppName: ${{ secrets.AZURE_SHOP_APP_NAME || 'solaris-shop' }}
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP || 'rg-solaris-prod' }}
          acrName: ${{ secrets.ACR_NAME }}
          acrUsername: ${{ secrets.ACR_USERNAME }}
          acrPassword: ${{ secrets.ACR_PASSWORD }}
